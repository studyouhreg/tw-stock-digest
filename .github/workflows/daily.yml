name: Taiwan stock digest

on:
  schedule:
    # Asia/Taipei 13:17 to 00:17 every hour, and 08:17 the next morning.
    # GitHub starts scheduled runs hours late, at unpredictable times, and
    # drops some, so no single slot can be relied on. Instead: every run
    # collects whatever is pending (seconds when there is nothing), and a run
    # that starts on a trading-day afternoon waits for the evening reports
    # (--wait), so the digest goes out the same evening whichever slot ran.
    - cron: '17 5-16 * * *'
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      demo:
        description: 'Synthetic demo; never contacts Drive or Claude'
        type: boolean
        default: true
      expected_date:
        description: 'Optional YYYY-MM-DD: collect (or re-collect) exactly this trading day'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: tw-stock-digest
  cancel-in-progress: false

jobs:
  digest:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 350   # a run may wait from mid-afternoon until the evening reports are out
    permissions:
      contents: write
      issues: write
    env:
      DEMO: ${{ github.event_name == 'workflow_dispatch' && inputs.demo && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Collect, archive and optionally analyze
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENABLE_ANALYSIS: ${{ vars.ENABLE_ANALYSIS || 'false' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-haiku-5-5' }}
          WATCHLIST: ${{ vars.WATCHLIST || '0050,2330,2317,2454,6488' }}
          REQUEST_DATE: ${{ inputs.expected_date }}
          WAIT: ${{ github.event_name == 'schedule' && (vars.WAIT_FOR_CLOSE || 'true') || 'false' }}
        run: |
          args=(--repo-dir data)
          if [[ "$DEMO" == "true" ]]; then args+=(--demo); fi
          if [[ "$WAIT" == "true" ]]; then args+=(--wait); fi
          if [[ -n "$REQUEST_DATE" ]]; then args+=(--date "$REQUEST_DATE"); fi
          python -m tw_stock_digest "${args[@]}"
      - name: Refresh the dashboard data
        if: ${{ !cancelled() && env.DEMO != 'true' }}
        run: python -m tw_stock_digest.dashboard --repo-dir data
      - name: Commit validated data even if an optional service failed
        if: ${{ !cancelled() && env.DEMO != 'true' }}
        run: bash scripts/commit_data.sh
      - name: Push the digest and any collection problem as GitHub issues
        if: ${{ !cancelled() && env.DEMO != 'true' && (vars.NOTIFY_ISSUES || 'true') == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m tw_stock_digest.notify --repo-dir data --run output/run.json
      - name: Retain collection even when analysis or Drive fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tw-stock-digest-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          retention-days: 14
          if-no-files-found: warn
